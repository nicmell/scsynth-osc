[package]
name = "scsynth-osc"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
authors = ["nicmell"]
description = "The OSC protocol of scsynth, the SuperCollider synthesis server: the commands and replies of the Server Command Reference, as Rust types that encode and decode strictly."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicmell/scsynth-osc"
readme = "README.md"
keywords = ["supercollider", "scsynth", "osc", "audio", "synthesis"]
categories = ["multimedia::audio", "encoding", "network-programming"]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
rosc = { version = "0.11.4", default-features = false }
serde = { version = "1.0.140", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.0", optional = true }
uuid = { version = "1.0.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.60"

[features]
serde = ["dep:serde", "dep:serde_bytes", "uuid/serde"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
