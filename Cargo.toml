[package]
name = "scsynth-osc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["nicmell"]
description = "The OSC protocol of scsynth, the SuperCollider synthesis server: every command and reply of the Server Command Reference, typed, and encoded and decoded strictly."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicmell/scsynth-osc"
readme = "README.md"
keywords = ["supercollider", "scsynth", "osc", "audio", "synthesis"]
categories = ["multimedia::audio", "encoding", "network-programming"]

[dependencies]
rosc = { version = "0.11.4", default-features = false }
serde = { version = "1.0.140", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.60"

[features]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
