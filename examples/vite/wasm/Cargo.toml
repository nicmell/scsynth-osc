[package]
name = "scsynth-osc-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "The wasm of the Vite example of scsynth-osc."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicmell/scsynth-osc"

[lib]
crate-type = ["cdylib"]

[dependencies]
scsynth-osc = { path = "../../..", features = ["serde"] }
serde = "1.0.140"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
